[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microcolossus"
version = "0.11.0"
description = "Experimental strict-budget training runtime focused on Apple Silicon MPS."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Ferdinando Bonsegna" }
]
dependencies = [
  "torch>=2.2",
  "PyYAML>=6.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "numpy>=2.4,<2.5",
  "pytest>=8.0",
  "ruff>=0.6",
  "types-psutil",
  "types-PyYAML",
]
benchmark = [
  "numpy>=2.4,<2.5",
  "mlx>=0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
microcolossus = "microcolossus.cli:main"
microcolossus-bounded-train = "microcolossus.bounded_training_cli:main"
microcolossus-prune = "microcolossus.pruning_cli:main"

[tool.setuptools.packages.find]
include = ["microcolossus*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
allow_redefinition = true

[[tool.mypy.overrides]]
module = ["mlx", "mlx.*"]
ignore_missing_imports = true
