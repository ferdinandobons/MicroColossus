name: Apply clean M6C patch

on:
  push:
    branches:
      - agent/m6c-hybrid-clean
    paths:
      - .github/workflows/apply-m6c-clean.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6c-hybrid-clean
          fetch-depth: 0
      - name: Reconstruct and verify patch
        run: |
          cat .m6c_payload/part* > /tmp/m6c.patch.gz.b64
          base64 -d /tmp/m6c.patch.gz.b64 > /tmp/m6c.patch.gz
          echo "f76b0c91790fb1e94fc23409dc824f7d74abc28464c0cf189a43da97ce1cf6b7  /tmp/m6c.patch.gz" | sha256sum -c -
          gzip -dc /tmp/m6c.patch.gz > /tmp/m6c.patch
          echo "ae0ae5b7d401e7ed7403cd2b243a2ebfface7f7f31fc3b663f04b61cb16870cd  /tmp/m6c.patch" | sha256sum -c -
      - name: Apply patch to accepted main
        run: |
          git fetch origin main
          git reset --hard origin/main
          git apply --index /tmp/m6c.patch
          git diff --cached --check
          python -m compileall -q microcolossus
      - name: Commit clean implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Add measured hybrid activation-anchor planning"
          git push --force-with-lease origin HEAD:agent/m6c-hybrid-clean
