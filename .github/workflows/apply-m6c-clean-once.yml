name: Apply clean M6C patch once

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/m6c-hybrid-clean'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6c-hybrid-clean
          fetch-depth: 0
      - name: Reconstruct verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .m6c_payload/part* > /tmp/m6c.patch.gz.b64
          base64 -d /tmp/m6c.patch.gz.b64 > /tmp/m6c.patch.gz
          echo "f76b0c91790fb1e94fc23409dc824f7d74abc28464c0cf189a43da97ce1cf6b7  /tmp/m6c.patch.gz" | sha256sum -c -
          gzip -dc /tmp/m6c.patch.gz > /tmp/m6c.patch
          echo "ae0ae5b7d401e7ed7403cd2b243a2ebfface7f7f31fc3b663f04b61cb16870cd  /tmp/m6c.patch" | sha256sum -c -
      - name: Replace temporary branch with clean implementation
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard 9f9365e597693e2cffa4f454180203e7219a7cde
          git clean -fdx
          git apply --index /tmp/m6c.patch
          git diff --cached --check
          python -m compileall -q microcolossus
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Add measured hybrid activation-anchor planning"
          git push --force origin HEAD:agent/m6c-hybrid-clean
