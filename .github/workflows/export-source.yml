name: Export source snapshot

on:
  push:
    branches:
      - agent/m6c-hybrid-anchors
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          tar --exclude=.git --exclude=.venv -czf /tmp/microcolossus-source.tgz .
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: microcolossus-source
          path: /tmp/microcolossus-source.tgz
          if-no-files-found: error
          retention-days: 1
