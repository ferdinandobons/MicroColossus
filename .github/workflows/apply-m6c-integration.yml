name: Apply M6C integration repairs

on:
  push:
    branches:
      - agent/m6c-hybrid-activation-planner
    paths:
      - .github/workflows/apply-m6c-integration.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6c-hybrid-activation-planner
      - name: Repair M6C integration contracts
        run: |
          base64 -d .github/m6c_repair.b64 | gzip -d > /tmp/m6c_repair.py
          python /tmp/m6c_repair.py
      - name: Compile repaired source
        run: python -m compileall -q microcolossus
      - name: Commit repaired integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            microcolossus/activation_planner.py \
            microcolossus/persistent_hybrid.py \
            microcolossus/persistent_step.py \
            microcolossus/bounded_training_types.py \
            microcolossus/bounded_training.py \
            microcolossus/training_checkpoint.py \
            microcolossus/__init__.py \
            pyproject.toml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Repair M6C package and persistent integration"
          git push origin HEAD:agent/m6c-hybrid-activation-planner
