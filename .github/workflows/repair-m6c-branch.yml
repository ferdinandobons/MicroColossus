name: Repair M6C branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/m6c-hybrid-activation-planner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6c-hybrid-activation-planner
      - name: Apply M6C integration repair
        id: repair
        continue-on-error: true
        run: |
          set +e
          base64 -d .github/m6c_repair.b64 | gzip -d > /tmp/m6c_repair.py
          python /tmp/m6c_repair.py > /tmp/m6c-repair.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python -m compileall -q microcolossus >> /tmp/m6c-repair.log 2>&1
            status=$?
          fi
          cp /tmp/m6c-repair.log .github/m6c_repair.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Commit repair or diagnostic journal
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/m6c_repair.log
          if [ "${{ steps.repair.outputs.status }}" = "0" ]; then
            git add \
              microcolossus/activation_planner.py \
              microcolossus/persistent_hybrid.py \
              microcolossus/persistent_step.py \
              microcolossus/bounded_training_types.py \
              microcolossus/bounded_training.py \
              microcolossus/training_checkpoint.py \
              microcolossus/__init__.py \
              pyproject.toml
            message="Repair M6C package and persistent integration"
          else
            message="Record M6C repair failure journal"
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "$message"
          git push origin HEAD:agent/m6c-hybrid-activation-planner
      - name: Fail when repair failed
        if: steps.repair.outputs.status != '0'
        run: exit 1
