name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  m6c-diagnose:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/m6c-hybrid-clean'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6c-hybrid-clean
          fetch-depth: 0
      - name: Diagnose checksummed M6C publication
        id: diagnose
        shell: bash
        run: |
          set +e
          {
            set -euxo pipefail
            ls -la .m6c_payload
            cat .m6c_payload/part* > /tmp/m6c.patch.gz.b64
            wc -c /tmp/m6c.patch.gz.b64
            base64 -d /tmp/m6c.patch.gz.b64 > /tmp/m6c.patch.gz
            sha256sum /tmp/m6c.patch.gz
            echo 'f76b0c91790fb1e94fc23409dc824f7d74abc28464c0cf189a43da97ce1cf6b7  /tmp/m6c.patch.gz' | sha256sum -c -
            gzip -dc /tmp/m6c.patch.gz > /tmp/m6c.patch
            sha256sum /tmp/m6c.patch
            echo 'ae0ae5b7d401e7ed7403cd2b243a2ebfface7f7f31fc3b663f04b61cb16870cd  /tmp/m6c.patch' | sha256sum -c -
            git reset --hard 9f9365e597693e2cffa4f454180203e7219a7cde
            git clean -fdx
            git apply --check /tmp/m6c.patch
            git apply --index /tmp/m6c.patch
            git restore --source=9f9365e597693e2cffa4f454180203e7219a7cde --staged --worktree .github/workflows/ci.yml
            git diff --cached --check
            python -m compileall -q microcolossus
            git status --short
          } > /tmp/m6c-diagnostic.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -c 12000 /tmp/m6c-diagnostic.log > /tmp/m6c-diagnostic-tail.log
          cat /tmp/m6c-diagnostic-tail.log
          exit 0
      - name: Publish diagnostic comment
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_STATUS: ${{ steps.diagnose.outputs.status }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          text = pathlib.Path('/tmp/m6c-diagnostic-tail.log').read_text(errors='replace')
          body = {
              'body': (
                  '### Automated M6C publication diagnostic\n\n'
                  f'Status: `{os.environ.get("DIAGNOSTIC_STATUS", "unknown")}`\n\n'
                  '```text\n' + text + '\n```'
              )
          }
          request = urllib.request.Request(
              'https://api.github.com/repos/ferdinandobons/MicroColossus/issues/33/comments',
              data=json.dumps(body).encode(),
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(request) as response:
              print(response.status)
          PY
      - name: Fail diagnostic job when preparation failed
        if: steps.diagnose.outputs.status != '0'
        run: exit 1
