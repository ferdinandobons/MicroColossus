name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Release transaction payloads locally
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          python - <<'PY'
          from pathlib import Path

          path = Path("microcolossus/storage/store.py")
          text = path.read_text()
          abort_marker = "        )\n\n    def _inject(self, point: FailurePoint, **context: Any) -> None:\n"
          abort_replacement = (
              "        )\n"
              "        self._payloads.clear()\n"
              "        self._explicit_versions.clear()\n\n"
              "    def _inject(self, point: FailurePoint, **context: Any) -> None:\n"
          )
          commit_marker = (
              "        telemetry = self.store._record_telemetry(\n"
              "            telemetry,\n"
              "            counted_writes=physical_chunk_bytes + metadata_bytes_written,\n"
              "        )\n"
              "        return CommitResult(manifest=candidate, telemetry=telemetry)\n"
          )
          commit_replacement = (
              "        telemetry = self.store._record_telemetry(\n"
              "            telemetry,\n"
              "            counted_writes=physical_chunk_bytes + metadata_bytes_written,\n"
              "        )\n"
              "        self._payloads.clear()\n"
              "        self._explicit_versions.clear()\n"
              "        return CommitResult(manifest=candidate, telemetry=telemetry)\n"
          )
          if "    def abort(" not in text:
              raise SystemExit("abort method not found")
          abort_start = text.index("    def abort(")
          inject_start = text.index("    def _inject", abort_start)
          abort_section = text[abort_start:inject_start]
          if "self._payloads.clear()" not in abort_section:
              marker_index = text.index(abort_marker, abort_start)
              text = text[:marker_index] + text[marker_index:].replace(
                  abort_marker,
                  abort_replacement,
                  1,
              )
          if commit_marker in text:
              text = text.replace(commit_marker, commit_replacement, 1)
          elif "self._payloads.clear()\n        self._explicit_versions.clear()\n        return CommitResult" not in text:
              raise SystemExit("commit payload-release target not found")
          path.write_text(text)
          PY
      - name: Publish transaction payload release
        if: matrix.python-version == '3.11' && github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add microcolossus/storage/store.py
          git commit -m "Release staged payloads after transaction completion"
          git push origin "HEAD:$HEAD_REF"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        shell: bash
        run: |
          set -o pipefail
          mypy microcolossus 2>&1 | tee mypy-${{ matrix.python-version }}.txt
      - name: Upload type-check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-${{ matrix.python-version }}
          path: mypy-${{ matrix.python-version }}.txt
          if-no-files-found: error
      - name: Test
        run: python -m pytest
      - name: Compile
        run: python -m compileall -q microcolossus
      - name: CPU smoke
        run: |
          microcolossus doctor
          microcolossus plan --config examples/tiny-mps.yaml
          microcolossus train --config examples/tiny-resident.yaml --steps 1 --device cpu
          microcolossus benchmark \
            --config examples/tiny-resident.yaml \
            --backend pytorch \
            --warmup-steps 0 \
            --steps 1 \
            --output /tmp/microcolossus-benchmark.json
          microcolossus store-init \
            --path /tmp/microcolossus-store \
            --chunk-size-mib 1 \
            --max-staging-mib 1 \
            --max-storage-gib 0.01
          microcolossus store-verify --path /tmp/microcolossus-store
          microcolossus store-recover --path /tmp/microcolossus-store
          microcolossus storage-step \
            --config examples/micro-storage.yaml \
            --store /tmp/microcolossus-storage-step-store \
            --output /tmp/microcolossus-storage-step.json \
            --device cpu
          microcolossus store-verify --path /tmp/microcolossus-storage-step-store
          microcolossus bounded-forward \
            --config examples/micro-storage.yaml \
            --store /tmp/microcolossus-bounded-forward-store \
            --output /tmp/microcolossus-bounded-forward.json \
            --device cpu \
            --parameter-working-set-mib 1
          microcolossus store-verify --path /tmp/microcolossus-bounded-forward-store
          microcolossus bounded-backward \
            --config examples/micro-storage.yaml \
            --parameter-store /tmp/microcolossus-bounded-backward-parameters \
            --oracle-gradient-store /tmp/microcolossus-bounded-backward-oracle-gradients \
            --gradient-store /tmp/microcolossus-bounded-backward-gradients \
            --output /tmp/microcolossus-bounded-backward.json \
            --device cpu \
            --parameter-working-set-mib 1 \
            --gradient-working-set-mib 1
          microcolossus store-verify \
            --path /tmp/microcolossus-bounded-backward-parameters
          microcolossus store-verify \
            --path /tmp/microcolossus-bounded-backward-oracle-gradients
          microcolossus store-verify \
            --path /tmp/microcolossus-bounded-backward-gradients
