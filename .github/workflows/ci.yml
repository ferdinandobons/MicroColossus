name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy microcolossus
      - name: Test
        run: python -m pytest
      - name: Compile
        run: python -m compileall -q microcolossus
      - name: CPU smoke
        run: |
          microcolossus doctor
          microcolossus plan --config examples/tiny-mps.yaml
          microcolossus train --config examples/tiny-resident.yaml --steps 1 --device cpu
