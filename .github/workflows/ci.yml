name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Apply oracle gradient-store documentation locally
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("README.md"): [
                  (
                      "Bounded backward with a separate gradient store:",
                      "Bounded backward with separate oracle and bounded gradient stores:",
                  ),
                  (
                      "  --parameter-store runs/micro-backward-parameters \\\n"
                      "  --gradient-store runs/micro-backward-gradients \\\n",
                      "  --parameter-store runs/micro-backward-parameters \\\n"
                      "  --oracle-gradient-store runs/micro-backward-oracle-gradients \\\n"
                      "  --gradient-store runs/micro-backward-gradients \\\n",
                  ),
              ],
              Path("docs/storage.md"): [
                  (
                      "Parameter gradients are written to a separate "
                      "`VersionedTensorStore`. The parameter store is never modified.",
                      "Resident-oracle gradients are first written to a dedicated "
                      "versioned store. The resident gradient payloads and bootstrap "
                      "parameter payloads are released before bounded execution begins. "
                      "Bounded gradients are written to a second `VersionedTensorStore`. "
                      "The parameter store is never modified.",
                  ),
                  (
                      "After all groups complete, gradients are streamed from the gradient "
                      "store to calculate the global norm. The result includes the clipping "
                      "coefficient that a later optimizer phase would apply. Version 0.7 "
                      "does not update parameters.",
                      "After all groups complete, the oracle and bounded gradient stores are "
                      "streamed independently to calculate their global norms. The complete "
                      "states are loaded together only for the final tensor-level validation "
                      "comparison. The result includes the clipping coefficient that a later "
                      "optimizer phase would apply. Version 0.7 does not update parameters.",
                  ),
                  (
                      "- parameter and gradient manifest IDs;",
                      "- parameter, oracle-gradient, and bounded-gradient manifest IDs;",
                  ),
                  (
                      "  --parameter-store runs/micro-backward-parameters \\\n"
                      "  --gradient-store runs/micro-backward-gradients \\\n",
                      "  --parameter-store runs/micro-backward-parameters \\\n"
                      "  --oracle-gradient-store runs/micro-backward-oracle-gradients \\\n"
                      "  --gradient-store runs/micro-backward-gradients \\\n",
                  ),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"documentation replacement target not found: {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Publish oracle gradient-store documentation
        if: matrix.python-version == '3.11' && github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/storage.md
          git commit -m "Document separate oracle and bounded gradient stores"
          git push origin "HEAD:$HEAD_REF"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        shell: bash
        run: |
          set -o pipefail
          mypy microcolossus 2>&1 | tee mypy-${{ matrix.python-version }}.txt
      - name: Upload type-check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-${{ matrix.python-version }}
          path: mypy-${{ matrix.python-version }}.txt
          if-no-files-found: error
      - name: Test
        run: python -m pytest
      - name: Compile
        run: python -m compileall -q microcolossus
      - name: CPU smoke
        run: |
          microcolossus doctor
          microcolossus plan --config examples/tiny-mps.yaml
          microcolossus train --config examples/tiny-resident.yaml --steps 1 --device cpu
          microcolossus benchmark \
            --config examples/tiny-resident.yaml \
            --backend pytorch \
            --warmup-steps 0 \
            --steps 1 \
            --output /tmp/microcolossus-benchmark.json
          microcolossus store-init \
            --path /tmp/microcolossus-store \
            --chunk-size-mib 1 \
            --max-staging-mib 1 \
            --max-storage-gib 0.01
          microcolossus store-verify --path /tmp/microcolossus-store
          microcolossus store-recover --path /tmp/microcolossus-store
          microcolossus storage-step \
            --config examples/micro-storage.yaml \
            --store /tmp/microcolossus-storage-step-store \
            --output /tmp/microcolossus-storage-step.json \
            --device cpu
          microcolossus store-verify --path /tmp/microcolossus-storage-step-store
          microcolossus bounded-forward \
            --config examples/micro-storage.yaml \
            --store /tmp/microcolossus-bounded-forward-store \
            --output /tmp/microcolossus-bounded-forward.json \
            --device cpu \
            --parameter-working-set-mib 1
          microcolossus store-verify --path /tmp/microcolossus-bounded-forward-store
          microcolossus bounded-backward \
            --config examples/micro-storage.yaml \
            --parameter-store /tmp/microcolossus-bounded-backward-parameters \
            --oracle-gradient-store /tmp/microcolossus-bounded-backward-oracle-gradients \
            --gradient-store /tmp/microcolossus-bounded-backward-gradients \
            --output /tmp/microcolossus-bounded-backward.json \
            --device cpu \
            --parameter-working-set-mib 1 \
            --gradient-working-set-mib 1
          microcolossus store-verify \
            --path /tmp/microcolossus-bounded-backward-parameters
          microcolossus store-verify \
            --path /tmp/microcolossus-bounded-backward-oracle-gradients
          microcolossus store-verify \
            --path /tmp/microcolossus-bounded-backward-gradients
