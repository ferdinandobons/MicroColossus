name: Prepare M4B3 formatting

on:
  push:
    branches: [agent/m4b3-streamed-adamw]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m4b3-streamed-adamw
      - name: Fix top-level spacing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("microcolossus/bounded_optimizer.py")
          text = path.read_text()
          old = "        export_seconds,\n    )\n\ndef run_bounded_optimizer_step("
          new = "        export_seconds,\n    )\n\n\ndef run_bounded_optimizer_step("
          if old not in text:
              raise SystemExit("bounded optimizer spacing target not found")
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/m4b3-spacing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add microcolossus/bounded_optimizer.py
          git commit -m "Fix bounded optimizer top-level spacing"
          git push origin HEAD:agent/m4b3-streamed-adamw
