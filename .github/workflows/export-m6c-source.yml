name: Export M6C source

on:
  push:
    branches:
      - agent/m6c-hybrid-activation-planner
    paths:
      - .github/workflows/export-m6c-source.yml

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          tar --exclude=.git --exclude=.venv -czf "$RUNNER_TEMP/export/microcolossus-m6c-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: microcolossus-m6c-source
          path: ${{ runner.temp }}/export/microcolossus-m6c-source.tar.gz
          if-no-files-found: error
