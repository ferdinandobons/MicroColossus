name: Export M6C source

on:
  pull_request:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: tar --exclude=.git -czf /tmp/microcolossus-m6c-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: microcolossus-m6c-source
          path: /tmp/microcolossus-m6c-source.tar.gz
          if-no-files-found: error
