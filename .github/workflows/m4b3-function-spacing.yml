name: Prepare bounded optimizer function spacing

on:
  push:
    branches: [agent/m4b3-streamed-adamw]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m4b3-streamed-adamw
      - name: Fix function spacing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("microcolossus/bounded_optimizer.py")
          text = path.read_text()
          old = "        store_commit=commit.telemetry,\n    )\n\ndef _apply_adamw_group("
          new = "        store_commit=commit.telemetry,\n    )\n\n\ndef _apply_adamw_group("
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit("resident-oracle spacing target not found")
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/m4b3-function-spacing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add microcolossus/bounded_optimizer.py
          git commit -m "Fix bounded optimizer function spacing"
          git push origin HEAD:agent/m4b3-streamed-adamw
