name: micro-storage-step
output_dir: runs/micro-storage-step

model:
  vocab_size: 64
  max_sequence_length: 32
  layers: 1
  heads: 4
  hidden_size: 32
  mlp_ratio: 2
  dropout: 0.0
  norm_epsilon: 0.00001
  tie_embeddings: true

training:
  mode: reference
  steps: 1
  micro_batch_size: 1
  sequence_length: 8
  learning_rate: 0.001
  weight_decay: 0.1
  gradient_clip_norm: 1.0
  seed: 42
  device: cpu

hardware:
  accelerator_memory_gib: 1.0
  process_ram_gib: 1.0
  system_memory_gib: 1.0
  nvme_gib: 0.05
  ssd_write_budget_tb: 1.0
  memory_architecture: unified
